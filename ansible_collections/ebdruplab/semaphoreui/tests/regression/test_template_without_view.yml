---
- name: Regression | Backup templates without a board view
  hosts: localhost
  gather_facts: false
  vars:
    _view_title_by_id: {}
    item:
      id: 1
      name: no-view-template
  tasks:
    - name: Normalize an absent view_id without failing
      ansible.builtin.set_fact:
        normalized: "{{ {'view_title': (_view_title_by_id.get(item.get('view_id'), omit))} }}"

    - name: Assert no view title is emitted
      ansible.builtin.assert:
        that:
          - normalized.view_title is not defined
